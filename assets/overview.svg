<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">Hi-Lo Prune method overview</title>
  <desc id="desc">Three stages: hierarchical token selection, prune-aware fusion, and token removal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10172a"/>
      <stop offset="1" stop-color="#182a45"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1100" height="300" rx="24" fill="url(#bg)"/>
  <text x="550" y="46" fill="#f8fafc" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700">Look at what you will lose before pruning</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="55" y="85" width="275" height="155" rx="18" fill="#173b57" stroke="#4fc3f7" stroke-width="2"/>
    <text x="192" y="122" fill="#7dd3fc" text-anchor="middle" font-size="20" font-weight="700">1 · Hi → Lo Selection</text>
    <text x="192" y="155" fill="#e2e8f0" text-anchor="middle" font-size="15">Low-level patch diversity</text>
    <text x="192" y="179" fill="#e2e8f0" text-anchor="middle" font-size="15">then high-level semantics</text>
    <text x="192" y="210" fill="#fbbf24" text-anchor="middle" font-size="15">retain K + fusion candidates F</text>
    <path d="M340 162h74" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="420" y="85" width="275" height="155" rx="18" fill="#29335c" stroke="#a78bfa" stroke-width="2"/>
    <text x="557" y="122" fill="#c4b5fd" text-anchor="middle" font-size="20" font-weight="700">2 · PA-Fusion</text>
    <text x="557" y="155" fill="#e2e8f0" text-anchor="middle" font-size="15">Attention-guided transfer</text>
    <text x="557" y="179" fill="#e2e8f0" text-anchor="middle" font-size="15">from F into retained tokens</text>
    <text x="557" y="210" fill="#fbbf24" text-anchor="middle" font-size="15">information moves before removal</text>
    <path d="M705 162h74" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="785" y="85" width="260" height="155" rx="18" fill="#3b2944" stroke="#f472b6" stroke-width="2"/>
    <text x="915" y="122" fill="#f9a8d4" text-anchor="middle" font-size="20" font-weight="700">3 · Prune Once</text>
    <text x="915" y="155" fill="#e2e8f0" text-anchor="middle" font-size="15">Remove low-information tokens</text>
    <text x="915" y="179" fill="#e2e8f0" text-anchor="middle" font-size="15">at an early LLM layer</text>
    <text x="915" y="210" fill="#fbbf24" text-anchor="middle" font-size="15">less work in every later layer</text>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="550" y="274" fill="#94a3b8" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Training-free · single-layer removal · designed for aggressive visual-token reduction</text>
</svg>
